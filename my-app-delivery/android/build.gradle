// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { sub ->
    sub.afterEvaluate {
        if (sub.extensions.findByName('android') != null) {
            sub.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        sub.tasks.matching { it.class.name.contains('KotlinCompile') }.configureEach { task ->
            try {
                task.kotlinOptions.jvmTarget = '17'
            } catch (Exception ignored) {
                try {
                    task.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                } catch (Exception ignored2) { /* no kotlin */ }
            }
        }
    }
    sub.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
